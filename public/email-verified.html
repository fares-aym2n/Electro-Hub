<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8fafc" />
  <title>Email Verified Successfully</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #0f172a;
      --muted: #64748b;
      --green: #16a34a;
      --green-dark: #15803d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--navy);
      background:
        radial-gradient(circle at 15% 15%, rgba(34, 197, 94, .13), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(59, 130, 246, .12), transparent 30%),
        #f8fafc;
    }

    .card {
      width: min(100%, 480px);
      padding: 44px 36px 36px;
      text-align: center;
      background: rgba(255, 255, 255, .94);
      border: 1px solid rgba(226, 232, 240, .9);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, .10);
      animation: appear .55s ease both;
    }

    .icon-wrap {
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      margin: 0 auto 26px;
      border-radius: 50%;
      background: #dcfce7;
      box-shadow: 0 0 0 10px #f0fdf4;
    }

    .icon-wrap svg {
      width: 45px;
      height: 45px;
      stroke: var(--green-dark);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 6vw, 34px);
      line-height: 1.2;
      letter-spacing: -.04em;
    }

    .description {
      max-width: 340px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .footer {
      margin: 28px 0 0;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.7;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 420px) {
      .card { padding: 36px 24px 28px; border-radius: 22px; }
      .icon-wrap { width: 82px; height: 82px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="icon-wrap" aria-hidden="true">
      <svg viewBox="0 0 48 48">
        <path d="M12 25.5 20 33l16-18" />
      </svg>
    </div>

    <p class="eyebrow">Email verification complete</p>
    <h1>Your email is verified!</h1>
    <p class="description">
      Your email address has been verified successfully. You can now close this
      page and log in to your account to get started.
    </p>

    <p class="footer">
      Verification successful · You may safely close this browser tab.
    </p>
  </main>
</body>
</html>
